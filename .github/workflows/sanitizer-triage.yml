name: HTTP2 sanitizer triage
on:
  push:
    branches: [codex/h2-scheduler-experiments]
    paths:
      - .github/workflows/sanitizer-triage.yml
      - .github/experiments/ubsan_baseline_probe.py
permissions:
  contents: read
jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: experiments
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nginx/nginx
          ref: 140aa942711868a8daeb95810bc9a81f272ada72
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aleksandr-miheichev/nginx
          ref: 120b5a16d5bb409484aac66bf66a3fd5c6cde64e
          path: nginx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aleksandr-miheichev/nginx-tests
          ref: a3102bc7ff84c61071fcfa7d717d9e9ff06f9cf2
          path: tests
          persist-credentials: false
      - name: Install suite prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev libssl-dev zlib1g-dev libio-socket-ssl-perl libsocket6-perl
      - name: Establish unsuppressed UBSan baseline
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir -p results
          cd baseline
          auto/configure --with-cc=clang --with-http_v2_module \
            --without-http_rewrite_module --without-http_gzip_module \
            --with-cc-opt="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            --with-ld-opt="-fsanitize=address,undefined" > ../results/baseline-configure.log 2>&1
          make -j2 > ../results/baseline-build.log 2>&1
          cd ..
          python3 experiments/.github/experiments/ubsan_baseline_probe.py baseline/objs/nginx results/baseline-fixture > results/baseline-probe.log 2>&1
      - name: Build exact candidate with AddressSanitizer
        shell: bash
        run: |
          set -euo pipefail
          cd nginx
          auto/configure --with-debug --with-cc=clang --with-http_ssl_module \
            --with-http_v2_module --with-http_v3_module --with-http_realip_module \
            --with-http_auth_request_module --with-http_stub_status_module \
            --with-stream --with-stream_ssl_module \
            --with-stream_ssl_preread_module --with-stream_realip_module \
            --with-mail --with-mail_ssl_module --with-threads \
            --with-cc-opt="-O1 -g -fsanitize=address -fno-omit-frame-pointer" \
            --with-ld-opt="-fsanitize=address" > ../results/candidate-configure.log 2>&1
          make -j2 > ../results/candidate-build.log 2>&1
          objs/nginx -V > ../results/version.txt 2>&1
      - name: Run complete relevant protocol suite with ASan
        shell: bash
        run: |
          set -euo pipefail
          cd tests
          export TEST_NGINX_BINARY="$GITHUB_WORKSPACE/nginx/objs/nginx"
          mapfile -t files < <(find . -maxdepth 1 -name '*.t' -printf '%f\n' | grep -E '(^h2|^proxy_h2|^grpc|h2\.t$)' | sort)
          prove -v "${files[@]}" > ../results/asan-suite.log 2>&1
      - name: Check actual frame queue with ASan and unsuppressed UBSan
        shell: bash
        run: |
          set -euo pipefail
          cd nginx
          clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -I src/core -I src/event -I src/event/modules \
            -I src/event/quic -I src/os/unix -I objs -I src/http -I src/http/modules \
            -I src/http/v2 ../experiments/.github/experiments/h2_fifo_queue.c -o ../results/queue
          ../results/queue > ../results/queue.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sanitizer-triage
          path: results/
          retention-days: 30
