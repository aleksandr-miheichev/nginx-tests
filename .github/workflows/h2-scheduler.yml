name: HTTP2 full fairness validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full candidate commit SHA in aleksandr-miheichev/nginx
        required: true
        type: string
      tests_sha:
        description: Full candidate commit SHA in aleksandr-miheichev/nginx-tests
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [gcc-full, clang-asan-h2]
        integration: [standalone, pending-prs]
    env:
      LC_ALL: C
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      SOURCE_SHA: ${{ inputs.source_sha }}
      TESTS_SHA: ${{ inputs.tests_sha }}
      BUILD_MODE: ${{ matrix.mode }}
      INTEGRATION: ${{ matrix.integration }}
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TESTS_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aleksandr-miheichev/nginx
          ref: ${{ inputs.source_sha }}
          path: nginx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: aleksandr-miheichev/nginx-tests
          ref: ${{ inputs.tests_sha }}
          path: tests
          fetch-depth: 0
          persist-credentials: false
      - name: Install build and official suite prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libpcre2-dev zlib1g-dev \
            libssl-dev libio-socket-ssl-perl libsocket6-perl
      - name: Prepare, build, and test exact candidates
        shell: bash
        run: bash ci/.github/scripts/fairness-ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: full-fairness-${{ matrix.integration }}-${{ matrix.mode }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
